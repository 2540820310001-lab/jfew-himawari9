name: J-FEW Himawari-9 Downloader

on:
  schedule:
    # Cadangan saja — pemicu utama dari Apps Script (ZZZ_JFEW_H9_KICK v1.1:
    # siang 09–18 WITA tiap 10 menit, malam tiap 30 menit). Jangan dibuat rapat lagi.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: jfew-h9
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Unduh Himawari-9 WLF dan kirim ke Drive J-FEW
        run: python3 jfew_h9_job.py
        env:
          PTREE_USER: ${{ secrets.PTREE_USER }}
          PTREE_PASSWORD: ${{ secrets.PTREE_PASSWORD }}
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
          REMOTE_TEMPLATE: ${{ vars.REMOTE_TEMPLATE }}
          LOOKBACK_HOURS: "6"
