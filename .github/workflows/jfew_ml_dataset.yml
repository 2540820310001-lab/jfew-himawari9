name: J-FEW ML tahap 2 (model peluang kebakaran)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Tahun awal (default 2001)"
        required: false
        default: "2001"

permissions:
  contents: write            # menyimpan model ke folder ml_model/ di repo (dipakai peta risiko harian)

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install earthengine-api numpy pandas scikit-learn joblib
      - name: Bangun tabel data + latih & uji model
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          ML_START: ${{ github.event.inputs.start }}
        run: python3 jfew_ml_dataset.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jfew-ml-model
          path: ml_out/
      - name: Simpan model ke repo (ml_model/)
        run: |
          mkdir -p ml_model
          cp ml_out/jfew_ml_model.joblib ml_out/sklearn_version.txt ml_out/jfew_ml_metrics.json ml_model/
          git config user.name "jfew-bot"
          git config user.email "jfew-bot@users.noreply.github.com"
          git add ml_model
          git commit -m "J-FEW ML: perbarui model peluang kebakaran" || echo "tidak ada perubahan"
          git pull --rebase
          git push
