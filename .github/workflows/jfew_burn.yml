name: J-FEW Burned Area (dNBR otomatis)

on:
  schedule:
    - cron: "17 1 * * *"     # ±09:17 WITA (citra Sentinel-2 pagi hari sebelumnya sudah masuk)
    - cron: "17 9 * * *"     # ±17:17 WITA (citra Sentinel-2 hari ini, ±10:30 WITA, biasanya sudah masuk)
  workflow_dispatch: {}

jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install earthengine-api
      - name: Hitung luas terbakar aktual
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          JFEW_WEBAPP_URL: ${{ secrets.JFEW_WEBAPP_URL }}
          JFEW_BURN_TOKEN: ${{ secrets.JFEW_BURN_TOKEN }}
        run: python3 jfew_burn_job.py
