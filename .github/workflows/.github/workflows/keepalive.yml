name: J-FEW Keepalive

# GitHub menonaktifkan jadwal di repository publik yang tidak ada
# aktivitas selama 60 hari. Workflow ini membuat 1 commit kecil
# setiap awal bulan agar jadwal Himawari-9 tetap aktif.

on:
  schedule:
    - cron: "17 1 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit keepalive
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "jfew-bot"
          git config user.email "jfew-bot@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "keepalive $(date -u +%Y-%m)" || echo "tidak ada perubahan"
          git push
