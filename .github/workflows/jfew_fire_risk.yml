name: J-FEW risiko kebakaran harian (peta)

on:
  schedule:
    - cron: "17 21 * * *"      # 05.17 WITA tiap hari
  workflow_dispatch:

jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang paket (scikit-learn sama dengan versi saat model dilatih)
        run: pip install earthengine-api numpy pandas joblib "scikit-learn==$(cat ml_model/sklearn_version.txt)"
      - name: Hitung risiko besok & lusa → peta
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          JFEW_WEBAPP_URL: ${{ secrets.JFEW_WEBAPP_URL }}
          JFEW_BURN_TOKEN: ${{ secrets.JFEW_BURN_TOKEN }}
        run: python3 jfew_fire_risk.py
