name: J-FEW Emisi karbon kebakaran (boundary drone)

on:
  workflow_dispatch: {}

jobs:
  carbon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install earthengine-api
      - name: Hitung emisi karbon
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          JFEW_WEBAPP_URL: ${{ secrets.JFEW_WEBAPP_URL }}
          JFEW_BURN_TOKEN: ${{ secrets.JFEW_BURN_TOKEN }}
          JFEW_GWP: AR5
        run: python3 jfew_carbon_job.py
