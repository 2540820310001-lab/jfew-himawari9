name: J-FEW pesisir & cuaca ekstrem (gelombang, pasang, angin, gempa)

on:
  schedule:
    - cron: "11 */6 * * *"     # tiap 6 jam (4x sehari, hemat kuota Actions)
  workflow_dispatch:

jobs:
  coast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install earthengine-api
      - name: Pesisir & cuaca ekstrem → peta
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          JFEW_WEBAPP_URL: ${{ secrets.JFEW_WEBAPP_URL }}
          JFEW_BURN_TOKEN: ${{ secrets.JFEW_BURN_TOKEN }}
        run: python3 jfew_coast.py
